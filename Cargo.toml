[workspace]
resolver = "2"
members = [
    "crates/getrich-core",
    "crates/getrich-cli",
    "crates/getrich-api",
    "crates/getrich-gui",
]
default-members = ["crates/getrich-cli", "crates/getrich-api", "crates/getrich-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Yu Zhao"]
repository = "https://github.com/zooyees/GetRich"
rust-version = "1.83"

[workspace.dependencies]
getrich-core = { path = "crates/getrich-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
anyhow = "1"
clap = { version = "=4.5.23", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "=2.9.7", default-features = false, features = ["json"] }
url = "=2.5.2"
tiny_http = "0.12"
crossbeam-channel = "0.5"
image = { version = "=0.25.5", default-features = false, features = ["ico", "png"] }
eframe = { version = "=0.29.1", default-features = true }
egui = "=0.29.1"
# rustc 1.83: later 0.32.x / 0.7.3 lines published edition2024 or MSRV 1.85
wayland-protocols = "=0.32.12"
smithay-clipboard = "=0.7.2"
proc-macro-crate = "=3.3.0"
toml_edit = "=0.22.24"
indexmap = "=2.11.4"
unicode-segmentation = "=1.12.0"
async-lock = "=3.4.1"
toml = "=0.8.19"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
